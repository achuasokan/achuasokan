<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240" role="img" aria-label="Casa Ananda: A resort website that shows the place and makes booking simple.">
<style>

.fill{animation:fill 6s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes fill{0%{transform:scaleX(.15)}70%,100%{transform:scaleX(1)}}
.pulse{animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.rise{animation:rise 7s ease-in-out infinite alternate}
@keyframes rise{from{transform:translateY(22px)}to{transform:translateY(0)}}
.flash{animation:flash 4s infinite}
@keyframes flash{0%,70%,100%{opacity:.15}78%{opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<defs><clipPath id="c"><rect width="440" height="240" rx="20"/></clipPath>
<radialGradient id="glow"><stop offset="0" stop-color="#FFB547" stop-opacity=".35"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></radialGradient></defs>
<g clip-path="url(#c)"><rect width="440" height="240" fill="#131B33"/>
<circle cx="360" cy="40" r="140" fill="url(#glow)"/><g transform="translate(70 -14) scale(.8)"><g class="rise"><circle cx="340" cy="92" r="30" fill="#FFB547" opacity=".9"/></g>
<rect x="270" y="92" width="160" height="40" fill="#131B33"/>
<path d="M270 98q20-8 40 0t40 0t40 0t40 0" fill="none" stroke="#FFB547" stroke-width="2" opacity=".7"/>
<path d="M270 110q20-8 40 0t40 0t40 0t40 0" fill="none" stroke="#FFB547" stroke-width="2" opacity=".45"/>
<path d="M270 122q20-8 40 0t40 0t40 0t40 0" fill="none" stroke="#FFB547" stroke-width="2" opacity=".25"/></g></g>
<rect x=".5" y=".5" width="439" height="239" rx="20" fill="none" stroke="#26325A"/>
<text x="28" y="48" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#FFB547" font-weight="600">Luxury resort website</text>
<text x="28" y="96" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#E8ECFF" letter-spacing="-1">Casa Ananda</text>
<text x="28" y="128" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#8A94B8">A resort website that shows the</text>
<text x="28" y="150" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#8A94B8">place and makes booking simple.</text>
<rect x="28" y="190" width="90" height="28" rx="14" fill="#0B1020" stroke="#26325A"/><circle cx="42" cy="204" r="3.5" fill="#FFB547"/><text x="53" y="209" font-size="13" fill="#E8ECFF" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">Next.js</text><rect x="126" y="190" width="114" height="28" rx="14" fill="#0B1020" stroke="#26325A"/><circle cx="140" cy="204" r="3.5" fill="#FFB547"/><text x="151" y="209" font-size="13" fill="#E8ECFF" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">TypeScript</text>
</svg>