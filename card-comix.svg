<text x="28" y="128" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#8A94B8">An online comic store with</text>
<text x="28" y="150" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#8A94B8">browsing, a cart and checkout.</text>
