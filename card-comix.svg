<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240" role="img" aria-label="comiX: An online comic store with browsing, a cart and checkout.">
<style>

.fill{animation:fill 6s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes fill{0%{transform:scaleX(.15)}70%,100%{transform:scaleX(1)}}
.pulse{animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.rise{animation:rise 7s ease-in-out infinite alternate}
@keyframes rise{from{transform:translateY(22px)}to{transform:translateY(0)}}
.flash{animation:flash 4s infinite}
@keyframes flash{0%,70%,100%{opacity:.15}78%{opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<defs><clipPath id="c"><rect width="440" height="240" rx="20"/></clipPath>
<radialGradient id="glow"><stop offset="0" stop-color="#4FD1A5" stop-opacity=".35"/><stop offset="1" stop-color="#4FD1A5" stop-opacity="0"/></radialGradient></defs>
<g clip-path="url(#c)"><rect width="440" height="240" fill="#131B33"/>
<circle cx="360" cy="40" r="140" fill="url(#glow)"/><g transform="translate(40 6) scale(.88)"><g transform="rotate(-6 340 80)">
<rect x="272" y="38" width="76" height="52" rx="4" fill="#0B1020" stroke="#E8ECFF" stroke-width="2"/>
<rect x="354" y="38" width="64" height="52" rx="4" fill="#0B1020" stroke="#E8ECFF" stroke-width="2"/>
<rect x="272" y="96" width="146" height="36" rx="4" fill="#0B1020" stroke="#E8ECFF" stroke-width="2"/>
<circle cx="296" cy="64" r="3" fill="#4FD1A5"/><circle cx="308" cy="64" r="3" fill="#4FD1A5"/><circle cx="320" cy="64" r="3" fill="#4FD1A5"/><circle cx="302" cy="76" r="3" fill="#4FD1A5"/><circle cx="314" cy="76" r="3" fill="#4FD1A5"/>
<path class="flash" d="M386 48l8 16h-10l10 18-18-20h10z" fill="#FFB547"/>
<rect x="284" y="108" width="90" height="6" rx="3" fill="#8A94B8" opacity=".7"/><rect x="284" y="118" width="60" height="6" rx="3" fill="#8A94B8" opacity=".5"/></g></g></g>
<rect x=".5" y=".5" width="439" height="239" rx="20" fill="none" stroke="#26325A"/>
<text x="28" y="48" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#4FD1A5" font-weight="600">Comic book e-commerce</text>
