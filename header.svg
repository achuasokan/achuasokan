<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Achu Asokan, full stack developer. From concept to creation.">
<style>
.g1{animation:d1 14s ease-in-out infinite alternate;transform-box:fill-box}
.g2{animation:d2 17s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes d1{to{transform:translate(60px,30px)}}
@keyframes d2{to{transform:translate(-50px,-25px)}}
.role{opacity:0;animation:cyc 9s infinite}
.role.first{opacity:1}
@keyframes cyc{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:none}29%{opacity:1;transform:none}33%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
.pop{animation:pop 5s infinite;transform-box:fill-box;transform-origin:100% 100%;opacity:0}
@keyframes pop{0%,35%{opacity:0;transform:scale(.6)}42%,92%{opacity:1;transform:scale(1)}100%{opacity:0}}
.dot{animation:bounce 1.1s infinite;transform-box:fill-box}
.dot:nth-of-type(2){animation-delay:.15s}.dot:nth-of-type(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-3px);opacity:1}}
.typing{animation:typ 5s infinite}
@keyframes typ{0%{opacity:0}5%,30%{opacity:1}36%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pop{opacity:1}.typing{opacity:0}}
</style>
<defs>
<radialGradient id="ga"><stop offset="0" stop-color="#5B8CFF" stop-opacity=".45"/><stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/></radialGradient>
<radialGradient id="gb"><stop offset="0" stop-color="#FFB547" stop-opacity=".30"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#26325A" opacity=".55"/></pattern>
<clipPath id="cl"><rect width="900" height="320" rx="24"/></clipPath>
</defs>
<g clip-path="url(#cl)">
<rect width="900" height="320" fill="#0B1020"/>
<rect width="900" height="320" fill="url(#dots)"/>
<circle class="g1" cx="640" cy="90" r="220" fill="url(#ga)"/>
<circle class="g2" cx="140" cy="300" r="200" fill="url(#gb)"/>
</g>
<rect x=".5" y=".5" width="899" height="319" rx="24" fill="none" stroke="#26325A"/>

<text x="56" y="130" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#E8ECFF" letter-spacing="-2">Achu Asokan</text>
<text x="58" y="176" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="28" fill="#FFB547">From concept to creation.</text>

<g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="20" fill="#8A94B8">
<text class="role first" x="58" y="236">Full stack developer</text>
<text class="role" style="animation-delay:3s" x="58" y="236">Web and mobile applications</text>
<text class="role" style="animation-delay:6s" x="58" y="236">Real-time products people use</text>
</g>
<text x="58" y="276" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8A94B8" opacity=".8">Kerala, India</text>

<!-- browser -->
<g>
<rect x="590" y="46" width="250" height="168" rx="14" fill="#131B33" stroke="#26325A"/>
<path d="M590 60a14 14 0 0 1 14-14h222a14 14 0 0 1 14 14v18H590z" fill="#0B1020" opacity=".7"/>
<circle cx="608" cy="62" r="4" fill="#FF6B8A"/><circle cx="622" cy="62" r="4" fill="#FFB547"/><circle cx="636" cy="62" r="4" fill="#4FD1A5"/>
<rect x="656" y="55" width="150" height="14" rx="7" fill="#26325A" opacity=".6"/>
<rect x="610" y="96" width="120" height="12" rx="6" fill="#E8ECFF" opacity=".85"/>
<rect x="610" y="116" width="90" height="8" rx="4" fill="#8A94B8" opacity=".6"/>
<rect x="610" y="140" width="64" height="22" rx="11" fill="#5B8CFF"/>
<rect x="610" y="178" width="46" height="22" rx="6" fill="#26325A"/><rect x="662" y="178" width="46" height="22" rx="6" fill="#26325A"/><rect x="714" y="178" width="46" height="22" rx="6" fill="#26325A" opacity=".5"/>
</g>
<!-- phone -->
<g>
<rect x="752" y="104" width="112" height="190" rx="22" fill="#0B1020" stroke="#5B8CFF" stroke-width="1.5"/>
<rect x="796" y="112" width="24" height="5" rx="2.5" fill="#26325A"/>
<rect x="766" y="132" width="62" height="26" rx="13" fill="#131B33" stroke="#26325A"/>
<rect x="776" y="142" width="34" height="6" rx="3" fill="#8A94B8" opacity=".7"/>
<g class="typing"><rect x="766" y="168" width="44" height="24" rx="12" fill="#131B33" stroke="#26325A"/>
<circle class="dot" cx="780" cy="180" r="3" fill="#E8ECFF"/><circle class="dot" cx="788" cy="180" r="3" fill="#E8ECFF"/><circle class="dot" cx="796" cy="180" r="3" fill="#E8ECFF"/></g>
<g class="pop"><rect x="790" y="200" width="62" height="26" rx="13" fill="#5B8CFF"/><rect x="800" y="210" width="38" height="6" rx="3" fill="#fff" opacity=".9"/></g>
<rect x="772" y="262" width="72" height="22" rx="11" fill="#131B33" stroke="#26325A"/>
<circle cx="840" cy="273" r="0" fill="#4FD1A5"/>
</g>
</svg>